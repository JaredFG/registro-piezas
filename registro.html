<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de pieza</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="topbar">
    <h1>Registro de piezas — <span id="nombre-usuario"></span></h1>
    <button id="btn-salir">Salir</button>
  </div>

  <div class="contenedor">
    <div class="card">
      <h2>Nuevo registro</h2>
      <form id="form-registro">
        <div class="fila-dos">
          <div>
            <label for="folio">Folio</label>
            <input type="text" id="folio" required autocomplete="off" />
          </div>
          <div>
            <label for="fecha-hora">Fecha y hora</label>
            <input type="text" id="fecha-hora" disabled />
          </div>
        </div>
        <div id="estado-folio" class="estado-folio"></div>

        <div class="fila-tres">
          <div>
            <label for="op">OP</label>
            <input type="text" id="op" />
          </div>
          <div>
            <label for="estandar-pieza">Estándar de la pieza</label>
            <input type="text" id="estandar-pieza" required />
          </div>
          <div>
            <label for="piezas">Piezas</label>
            <input type="text" id="piezas" placeholder="Ej. 120,5,300" autocomplete="off" />
          </div>
        </div>

        <div class="fila-dos">
          <div>
            <label for="cliente">Cliente</label>
            <input type="text" id="cliente" required />
          </div>
          <div>
            <label for="fecha-factura">Fecha de factura</label>
            <input type="date" id="fecha-factura" />
          </div>
        </div>

        <div class="fila-dos">
          <div>
            <label for="material">Material</label>
            <input type="text" id="material" />
          </div>
          <div>
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" min="0" step="1" />
          </div>
        </div>

        <label for="factura">Factura</label>
        <input type="number" id="factura" min="0" step="1" inputmode="numeric" />

        <fieldset class="medidas-grupo">
          <legend>Medidas en pulgadas (largo × ancho × alto)</legend>
          <div class="fila-tres">
            <div><label for="medida-largo">Largo</label><input type="number" id="medida-largo" min="0" step="any" /></div>
            <div><label for="medida-ancho">Ancho</label><input type="number" id="medida-ancho" min="0" step="any" /></div>
            <div><label for="medida-alto">Alto</label><input type="number" id="medida-alto" min="0" step="any" /></div>
          </div>
          <div id="tamano-pieza" class="estado-folio"></div>
        </fieldset>

        <div class="fila-dos">
          <div>
            <label for="zona-origen">Zona de origen</label>
            <select id="zona-origen" required></select>
          </div>
          <div>
            <label for="zona-destino">Zona destino</label>
            <select id="zona-destino" required></select>
          </div>
        </div>

        <div id="bloque-origen-rack" hidden>
          <div class="fila-tres">
            <div><label for="origen-letra">Rack de origen</label><select id="origen-letra"></select></div>
            <div><label for="origen-posicion">Posición de origen</label><select id="origen-posicion"></select></div>
            <div><label for="origen-nivel">Nivel de origen</label><select id="origen-nivel"></select></div>
          </div>
        </div>

        <div id="bloque-rack">
          <div id="recomendacion" class="recomendacion">Captura el cliente, el estándar y las tres medidas para recibir una recomendación de rack.</div>
          <div class="fila-tres">
            <div><label for="rack-letra">Rack</label><select id="rack-letra"></select></div>
            <div><label for="rack-posicion">Posición</label><select id="rack-posicion"></select></div>
            <div><label for="rack-nivel">Nivel</label><select id="rack-nivel"></select></div>
          </div>
        </div>

        <label for="comentarios">Comentarios</label>
        <textarea id="comentarios"></textarea>

        <label for="estado">Estado piezas</label>
        <textarea id="estado"></textarea>

        <button type="submit" class="primario">Registrar</button>
        <div id="mensaje" class="mensaje"></div>
        <div id="cola-pendiente" class="estado-folio"></div>
      </form>
    </div>
  </div>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
